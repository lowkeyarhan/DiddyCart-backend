<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Reset Password - DiddyCart</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#000000",
              "primary-hover": "#333333",
              "background-light": "#FFFFFF",
              "background-dark": "#121212",
              "surface-light": "#FFFFFF",
              "surface-dark": "#1E1E1E",
              "text-light": "#000000",
              "text-dark": "#FFFFFF",
              "text-secondary-light": "#545454",
              "text-secondary-dark": "#A0A0A0",
              "border-light": "#E5E5E5",
              "border-dark": "#333333",
              "input-bg-light": "#F6F6F6",
              "input-bg-dark": "#2C2C2C",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
              body: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "8px",
              lg: "12px",
            },
            spacing: {
              128: "32rem",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 20px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.2);
      }
      .message-alert {
        display: none;
        animation: slideDown 0.3s ease;
      }
      .message-alert.show {
        display: block;
      }
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark antialiased h-screen w-screen overflow-hidden flex transition-colors duration-300"
  >
    <!-- Left Side - Image/Brand Section (Hidden on Mobile) -->
    <div
      class="hidden lg:flex lg:w-1/2 relative h-full bg-gray-900 overflow-hidden"
    >
      <img
        alt="Abstract black and white architectural structure with geometric patterns"
        class="absolute inset-0 w-full h-full object-cover opacity-80 mix-blend-overlay grayscale"
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuDNqyVkU0BuvGXq-xXu7V1LszmU6_mpR47ocJ3363DmkY7K52hoILFaTFCvH4NnNravBqZzj-eap252VeKQ1IOJAzb71vrmZakbT8Pzj1-9dfIlIWWFR8g6V1vxoGtPhLqVTfUAQ3mc3lJVKoIb7MQXgd_pAoh6mZpUzBxpI2CRHRPCBT2FXPbPrYBH7JhBAOuBQIEHozwrFKLpx9LAjtLq1wK-s_Gsu2ae3B4zsZ6SM8IK6BL1SNIfZdwuNERyOcPJYz8ePZNtOZ4"
      />
      <div
        class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"
      ></div>
      <div class="absolute bottom-12 left-12 text-white z-10 max-w-md">
        <h2 class="text-3xl font-light mb-4 tracking-tight">
          Security by Design.
        </h2>
        <p class="text-white/70 font-light leading-relaxed">
          Experience a seamless and secure environment built with precision and
          elegance. Your privacy is our architecture.
        </p>
      </div>
    </div>

    <!-- Right Side - Form Section -->
    <div
      class="w-full lg:w-1/2 flex flex-col justify-center items-center px-8 sm:px-12 md:px-24 bg-background-light dark:bg-background-dark relative overflow-y-auto"
    >
      <!-- Back to Login Link -->
      <div class="absolute top-8 left-8 sm:left-12 lg:left-24">
        <a
          class="flex items-center text-text-light dark:text-text-dark hover:text-text-secondary-light dark:hover:text-text-secondary-dark transition-colors duration-200 group"
          href="/api/auth/login"
        >
          <span
            class="material-icons text-xl mr-2 transform group-hover:-translate-x-1 transition-transform"
            >arrow_back</span
          >
          <span class="font-medium text-sm tracking-wide">Back to Login</span>
        </a>
      </div>

      <div class="w-full max-w-md">
        <!-- Header Section -->
        <div class="mb-10">
          <h1
            class="text-3xl sm:text-4xl font-semibold mb-3 tracking-tight text-text-light dark:text-text-dark"
          >
            Reset Password
          </h1>
          <p
            class="text-text-secondary-light dark:text-text-secondary-dark text-base font-light"
          >
            Enter your new password below to secure your account.
          </p>
        </div>

        <!-- Message Alert -->
        <div id="message" class="message-alert mb-6 p-4 rounded-lg"></div>

        <!-- Form -->
        <form id="resetForm" class="space-y-6">
          <input type="hidden" id="token" />

          <!-- New Password Field -->
          <div class="group relative">
            <label
              class="block text-sm font-medium text-text-secondary-light dark:text-text-secondary-dark mb-2 transition-colors group-focus-within:text-primary dark:group-focus-within:text-white"
              for="password"
              >New Password</label
            >
            <div class="relative">
              <input
                class="block w-full px-4 py-3.5 bg-input-bg-light dark:bg-input-bg-dark border border-transparent focus:border-black dark:focus:border-white rounded-lg text-text-light dark:text-text-dark placeholder-gray-400 dark:placeholder-gray-500 focus:ring-0 focus:outline-none transition-all duration-200 ease-in-out pr-12"
                id="password"
                name="password"
                placeholder="Enter new password"
                type="password"
                required
                minlength="6"
              />
              <button
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 focus:outline-none"
                type="button"
                onclick="togglePasswordVisibility('password', this)"
              >
                <span class="material-icons text-xl">visibility_off</span>
              </button>
            </div>
            <!-- Password Strength Indicator -->
            <div
              class="flex gap-1 mt-2 h-1 opacity-0 group-focus-within:opacity-100 transition-opacity duration-300"
            >
              <div
                class="flex-1 bg-gray-200 dark:bg-gray-700 rounded-full h-full overflow-hidden"
              >
                <div
                  id="strength-bar"
                  class="w-0 bg-primary h-full transition-all duration-500"
                ></div>
              </div>
              <div
                id="strength-bar-2"
                class="flex-1 bg-gray-200 dark:bg-gray-700 rounded-full h-full"
              ></div>
              <div
                id="strength-bar-3"
                class="flex-1 bg-gray-200 dark:bg-gray-700 rounded-full h-full"
              ></div>
              <div
                id="strength-bar-4"
                class="flex-1 bg-gray-200 dark:bg-gray-700 rounded-full h-full"
              ></div>
            </div>
          </div>

          <!-- Confirm Password Field -->
          <div class="group">
            <label
              class="block text-sm font-medium text-text-secondary-light dark:text-text-secondary-dark mb-2 transition-colors group-focus-within:text-primary dark:group-focus-within:text-white"
              for="confirmPassword"
              >Confirm Password</label
            >
            <div class="relative">
              <input
                class="block w-full px-4 py-3.5 bg-input-bg-light dark:bg-input-bg-dark border border-transparent focus:border-black dark:focus:border-white rounded-lg text-text-light dark:text-text-dark placeholder-gray-400 dark:placeholder-gray-500 focus:ring-0 focus:outline-none transition-all duration-200 ease-in-out pr-12"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter new password"
                type="password"
                required
                minlength="6"
              />
              <button
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 focus:outline-none"
                type="button"
                onclick="togglePasswordVisibility('confirmPassword', this)"
              >
                <span class="material-icons text-xl">visibility_off</span>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="pt-4">
            <button
              id="submitBtn"
              class="w-full flex justify-center py-4 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black dark:focus:ring-white transition-all duration-200 transform hover:-translate-y-0.5 disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none"
              type="submit"
            >
              Update Password
            </button>
          </div>
        </form>

        <!-- Contact Support Link -->
        <div class="mt-10 text-center">
          <p
            class="text-xs text-text-secondary-light dark:text-text-secondary-dark"
          >
            Having trouble?
            <a
              class="font-medium text-text-light dark:text-text-dark underline decoration-1 underline-offset-2 hover:text-primary transition-colors"
              href="#"
              >Contact Support</a
            >
          </p>
        </div>
      </div>

      <!-- Footer Links -->
      <div class="absolute bottom-6 w-full text-center lg:text-left lg:px-24">
        <div class="flex justify-center lg:justify-start space-x-6">
          <a
            class="text-xs text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors"
            href="#"
            >Privacy</a
          >
          <a
            class="text-xs text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors"
            href="#"
            >Terms</a
          >
        </div>
      </div>
    </div>

    <!-- Dark Mode Toggle Button -->
    <div class="fixed top-6 right-6 z-50">
      <button
        aria-label="Toggle Dark Mode"
        class="p-2 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors focus:outline-none shadow-sm"
        onclick="document.documentElement.classList.toggle('dark')"
      >
        <span class="material-icons text-xl block dark:hidden">dark_mode</span>
        <span class="material-icons text-xl hidden dark:block">light_mode</span>
      </button>
    </div>

    <script>
      // 1. Extract Token from URL (?token=xyz)
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");
      const messageDiv = document.getElementById("message");
      const submitBtn = document.getElementById("submitBtn");

      if (!token) {
        showMessage("Invalid link. No token found.", "error");
        document.getElementById("resetForm").style.display = "none";
      } else {
        document.getElementById("token").value = token;
      }

      // 2. Handle Form Submit
      document
        .getElementById("resetForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const password = document.getElementById("password").value;
          const confirm = document.getElementById("confirmPassword").value;

          if (password !== confirm) {
            showMessage("Passwords do not match!", "error");
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = "Updating...";

          try {
            const response = await fetch("/api/auth/reset-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token: token, newPassword: password }),
            });

            if (response.ok) {
              showMessage(
                "Password updated successfully! You can now login.",
                "success",
              );
              document.getElementById("resetForm").style.display = "none";
            } else {
              const data = await response.json();
              showMessage(data.message || "Failed to reset password", "error");
              submitBtn.disabled = false;
              submitBtn.textContent = "Update Password";
            }
          } catch (error) {
            showMessage("Network error occurred", "error");
            submitBtn.disabled = false;
            submitBtn.textContent = "Update Password";
          }
        });

      // 3. Show Message Function
      function showMessage(text, type) {
        messageDiv.textContent = text;
        messageDiv.className = "message-alert show";

        if (type === "error") {
          messageDiv.className +=
            " bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-800";
        } else if (type === "success") {
          messageDiv.className +=
            " bg-green-50 dark:bg-green-900/20 text-green-600 dark:text-green-400 border border-green-200 dark:border-green-800";
        }
      }

      // 4. Toggle Password Visibility
      function togglePasswordVisibility(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector(".material-icons");

        if (input.type === "password") {
          input.type = "text";
          icon.textContent = "visibility";
        } else {
          input.type = "password";
          icon.textContent = "visibility_off";
        }
      }

      // 5. Password Strength Indicator
      document
        .getElementById("password")
        .addEventListener("input", function (e) {
          const password = e.target.value;
          const strengthBar = document.getElementById("strength-bar");
          const strengthBar2 = document.getElementById("strength-bar-2");
          const strengthBar3 = document.getElementById("strength-bar-3");
          const strengthBar4 = document.getElementById("strength-bar-4");

          let strength = 0;
          if (password.length >= 6) strength++;
          if (password.length >= 10) strength++;
          if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength++;
          if (/[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password))
            strength++;

          // Reset all bars
          strengthBar.style.width = "0";
          strengthBar2.classList.remove("bg-primary", "dark:bg-white");
          strengthBar3.classList.remove("bg-primary", "dark:bg-white");
          strengthBar4.classList.remove("bg-primary", "dark:bg-white");

          // Fill bars based on strength
          if (strength >= 1) {
            strengthBar.style.width = "100%";
          }
          if (strength >= 2) {
            strengthBar2.classList.add("bg-primary", "dark:bg-white");
          }
          if (strength >= 3) {
            strengthBar3.classList.add("bg-primary", "dark:bg-white");
          }
          if (strength >= 4) {
            strengthBar4.classList.add("bg-primary", "dark:bg-white");
          }
        });
    </script>
  </body>
</html>
