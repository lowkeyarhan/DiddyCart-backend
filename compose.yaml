services:
  redis:
    image: "redis:latest"
    container_name: diddycart-redis
    ports:
      - "6379:6379"
    networks:
      - diddycart-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: diddycart-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - diddycart-network
    # NEW: Healthcheck ensures Zookeeper is actually running
    healthcheck:
      test: echo srvr | nc localhost 2181 || exit 1
      interval: 10s
      retries: 5
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: diddycart-kafka
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy # Wait for Zookeeper to be HEALTHY, not just started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Ensure the broker actually listens on both the internal (Docker) and host-mapped ports.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Shorter session timeout reduces the window where a previous broker session can block restart.
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 6000
    networks:
      - diddycart-network
    restart: unless-stopped
    # NEW: Healthcheck ensures Kafka Broker is ready
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1
      interval: 10s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diddycart-app
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - key_id=${key_id}
      - key_secret=${key_secret}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy # NEW: Wait for Kafka to be fully ready
    networks:
      - diddycart-network
    restart: unless-stopped

networks:
  diddycart-network:
    driver: bridge
